name: survey_3x3
description: |
  Stage 2 reference mission #3: a 3x3 lawnmower survey at 4 m altitude
  over a 30 m x 30 m square. Six survey lines (3 east-bound + 3 west-bound,
  alternating). Useful for camera-data-collection tests since the drone
  spends most of its time in steady forward flight.

  Gates:
    - 95th-percentile cross-track error < 0.5 m  (tighter than square_20m
      because survey paths must be straight lines for usable imagery)
    - 95th-percentile altitude error < 0.3 m
    - 100% completion
    - RTL final position < 1.0 m from home

takeoff:
  altitude_m: 4.0

defaults:
  altitude_m: 4.0
  hold_s: 0.0
  accept_radius_m: 1.5

# Grid origin at south-west corner: home = (0, 0). Lines run east at y=0,
# 15, 30; turn-arounds connect them with short legs.
waypoints:
  - {north_m:  0,  east_m:  0}    # SW corner (start)
  - {north_m:  0,  east_m: 30}    # SW -> SE  (line 1)
  - {north_m: 15,  east_m: 30}    # turn N
  - {north_m: 15,  east_m:  0}    # SE -> SW  (line 2)
  - {north_m: 30,  east_m:  0}    # turn N
  - {north_m: 30,  east_m: 30}    # NW -> NE  (line 3)

return:
  type: rtl
